[tool.poetry]
name = "mysr"
version = "0.1.0"
description = "MySR - symbolic regression toolkit for nuclear physics (merged PySR frontend + SymbolicRegression.jl backend)"
authors = ["Mingyu Tao <mingyutao020410@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "mysr" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = ">=2.0"
pandas = ">=2.0"
scipy = ">=1.11"
sympy = ">=1.12"
scikit-learn = ">=1.3"
matplotlib = ">=3.7"
pysr = ">=0.16"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.16"
black = ">=24.0"
mypy = ">=1.0"
poetry-core = ">=2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
