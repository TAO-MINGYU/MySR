[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mysr"
version = "1.0.0"
authors = [
    {name = "Mingyu Tao"},
    {name = "Miles Cranmer", email = "miles.cranmer@gmail.com"},
]
description = "General-purpose symbolic regression with a Python frontend and Julia core"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    "sympy>=1.14.0,<2.0.0",
    "pandas>=0.21.0,<4.0.0",
    "numpy>=1.13.0,<3.0.0",
    "scipy>=1.6.0,<2.0.0",
    "scikit_learn>=1.0.0,<2.0.0",
    "juliacall>=0.9.28,<0.9.36",
    "click>=7.0.0,<9.0.0",
    "typing-extensions>=4.0.0,<5.0.0",
]

[project.scripts]
mysr = "mysr._cli.main:mysr"

[project.urls]
Homepage = "https://github.com/TAO-MINGYU/MySR"
Repository = "https://github.com/TAO-MINGYU/MySR"
Backend = "https://github.com/TAO-MINGYU/MySRCore.jl"

[project.optional-dependencies]
rnn = [
    "torch>=2.7,<3",
]
docs = [
    "docstring-parser>=0.17.0",
    "pyyaml>=6.0.0",
]
dev = [
    "coverage>=7,<8",
    "beartype>=0.19,<0.23",
    "ipykernel>=6,<8",
    "ipython>=8,<10",
    "jax[cpu]>=0.4,<0.12",
    "jupyter>=1,<2",
    "mypy>=1,<3",
    "nbval>=0.11,<0.12",
    "pandas-stubs",
    "pre-commit>=3.0,<5",
    "pytest-cov>=5,<8",
    "pytest>=8,<10",
    "tensorboard>=2,<3",
    "torch>=2.7,<3",
    "types-openpyxl",
    "types-pytz",
]

[tool.isort]
profile = "black"

[tool.hatch.build.targets.wheel]
packages = ["mysr"]

[tool.hatch.build.targets.sdist]
include = [
    "/FORK_CHANGES.md",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/VENDORING.md",
    "/mysr",
    "/pyproject.toml",
    "/tests",
]
